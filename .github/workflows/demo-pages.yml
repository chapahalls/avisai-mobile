name: Demo (GitHub Pages)

# Publica o app do motorista no modo simulado em https://rodarglobal.github.io/rodar-mobile/
# a cada push na main. Precisa, uma vez: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: App para a web (modo simulado)
        run: ./scripts/web-demo/build.sh "$RUNNER_TEMP/site" /rodar-mobile
      - name: Fallback para links diretos
        run: cp "$RUNNER_TEMP/site/index.html" "$RUNNER_TEMP/site/404.html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
