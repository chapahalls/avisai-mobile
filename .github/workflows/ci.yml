name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Lint (ESLint, config do Expo)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Testes (Vitest)
        run: npm test
